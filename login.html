<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AgriAdvisor</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #020905;
    }
    .auth-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      position: relative;
      z-index: 1;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      padding: 44px 40px;
      animation: fadeInScale 0.6s ease;
      background: rgba(8,22,14,0.50);
      border: 1px solid rgba(255,255,255,0.10);
      backdrop-filter: blur(18px);
    }
    .auth-header { text-align:center; margin-bottom:36px; }
    .auth-logo {
      width: 62px;
      height: 62px;
      border-radius: 18px;
      margin: 0 auto 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #16a34a, #22c55e);
      color: #021008;
      font-size: 28px;
      font-weight: 900;
      box-shadow: 0 14px 30px rgba(34,197,94,0.22);
      animation: bounce 2s ease-in-out infinite;
    }
    @keyframes bounce {
      0%,100%{ transform:translateY(0); }
      50%{ transform:translateY(-8px); }
    }
    .auth-title { font-size:26px; font-weight:800; color:var(--c-text-1); }
    .auth-sub   { font-size:14px; color:var(--c-text-mute); margin-top:6px; }
    .password-wrapper { position:relative; }
    .password-wrapper .form-input { padding-right:46px; }
    .toggle-pwd {
      position:absolute; right:14px; top:50%; transform:translateY(-50%);
      background:none; border:none; cursor:pointer; font-size:16px; color:var(--c-text-mute);
      transition:color 0.2s;
    }
    .toggle-pwd:hover { color:var(--c-green-1); }
    .forgot-link { text-align:right; font-size:12px; margin-top:8px; }
    .forgot-link a { color:var(--c-green-1); text-decoration:none; }
    .forgot-link a:hover { text-decoration:underline; }
    .divider { text-align:center; margin:20px 0; position:relative; }
    .divider::before {
      content:''; position:absolute; left:0; top:50%; width:100%; height:1px; background:rgba(255,255,255,0.08);
    }
    .divider span {
      position:relative; padding:0 12px; background:#020905; color:var(--c-text-mute); font-size:13px;
    }
    .signup-link { text-align:center; margin-top:20px; font-size:14px; color:var(--c-text-mute); }
    .signup-link a { color:var(--c-green-1); text-decoration:none; font-weight:600; }
    .signup-link a:hover { text-decoration:underline; }
    .error-msg {
      display:none;
      padding:12px 16px;
      border-radius:10px;
      background:rgba(239,68,68,0.1);
      border:1px solid rgba(239,68,68,0.3);
      color:#fca5a5;
      font-size:13px;
      margin-bottom:16px;
    }
    .error-msg.show { display:block; }
  </style>
</head>
<body>
  <div class="auth-video-bg" aria-hidden="true">
    <video autoplay muted loop playsinline preload="auto">
      <source src="farmlanddrone.mp4" type="video/mp4">
    </video>
    <div class="auth-video-dim"></div>
  </div>
  <div class="bg-animated"></div>
  <div class="particles" id="particles"></div>

  <header class="site-header">
    <a href="index.html" class="brand">
      <span class="brand-icon">AG</span>
      <div>
        <div class="brand-name">AgriAdvisor</div>
        <div class="brand-sub">Digital Farming Advisory System</div>
      </div>
    </a>
    <nav>
      <a href="index.html" class="nav-link">Home</a>
      <a href="register.html" class="btn btn-secondary btn-sm" style="margin-left:8px;">Register</a>
    </nav>
  </header>

  <div class="auth-wrapper">
    <div class="auth-card glass">
      <div class="auth-header">
        <div class="auth-logo">AG</div>
        <div class="auth-title">Welcome Back</div>
        <div class="auth-sub">Login to your farm dashboard</div>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div id="errorMsg" class="error-msg"></div>

        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="tel" class="form-input" id="phone" placeholder="+91 98765 43210" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="password-wrapper">
            <input type="password" class="form-input" id="password" placeholder="Enter password" required>
            <button type="button" class="toggle-pwd" onclick="togglePwd('password', this)">Show</button>
          </div>
        </div>

        <div class="forgot-link">
          <a href="javascript:void(0)" onclick="alert('Password reset coming soon!')">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-full mt-16">Login</button>
      </form>

      <div class="divider"><span>New to AgriAdvisor?</span></div>
      <a href="register.html" class="btn btn-secondary btn-full">Create Account</a>

      <div class="signup-link">
        Demo: Phone <strong>9876543210</strong> | Pass <strong>SecurePass123</strong>
      </div>
    </div>
  </div>

  <script src="js/api-service.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const pc = document.getElementById('particles');
    for (let i = 0; i < 14; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const s = Math.random() * 5 + 2;
      p.style.cssText = `width:${s}px;height:${s}px;left:${Math.random()*100}%;animation-duration:${Math.random()*18+10}s;animation-delay:${Math.random()*12}s;`;
      pc.appendChild(p);
    }

    function togglePwd(id, btn) {
      const el = document.getElementById(id);
      if (el.type === 'password') {
        el.type = 'text';
        btn.textContent = 'Hide';
      } else {
        el.type = 'password';
        btn.textContent = 'Show';
      }
    }

    function showError(message) {
      const errorEl = document.getElementById('errorMsg');
      errorEl.textContent = message;
      errorEl.classList.add('show');
    }

    function hideError() {
      document.getElementById('errorMsg').classList.remove('show');
    }

    async function handleLogin(e) {
      e.preventDefault();
      hideError();

      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;

      if (!phone || !password) {
        showError('Please fill in all fields');
        return;
      }

      const form = document.getElementById('loginForm');
      const btn = form.querySelector('button[type="submit"]');
      const original = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Logging in...';
      showAuthLoadingOverlay('Logging in...', 'Verifying your credentials and loading the dashboard.');

      try {
        const response = await APIService.login({ phone, password });
        APIService.storeUserData(response.user);
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1300);
      } catch (err) {
        console.error('Login error:', err);
        hideAuthLoadingOverlay();
        showError(err.message || 'Login failed. Please check credentials.');
        btn.textContent = original;
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>

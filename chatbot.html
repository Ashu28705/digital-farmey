<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chatbot - AgriAdvisor</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body { min-height:100vh; }
    .chat-page {
      display:grid;
      grid-template-rows:auto 1fr auto;
      min-height:calc(100vh - 66px);
    }
    .chat-hero {
      padding:28px 24px 18px;
      border-bottom:1px solid var(--c-border);
      background:linear-gradient(180deg, rgba(34,197,94,0.08), rgba(5,18,10,0));
    }
    .chat-hero h1 {
      margin:0;
      font-size:30px;
      line-height:1.1;
      color:var(--c-text-1);
    }
    .chat-hero p {
      margin:8px 0 0;
      color:var(--c-text-mute);
      max-width:720px;
    }
    .chat-status {
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin-top:14px;
      padding:8px 12px;
      border-radius:999px;
      border:1px solid rgba(34,197,94,0.22);
      background:rgba(34,197,94,0.08);
      color:var(--c-green-1);
      font-size:12px;
      font-weight:700;
    }
    .status-dot {
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--c-green-1);
      box-shadow:0 0 0 4px rgba(34,197,94,0.15);
    }
    .chat-shell {
      display:grid;
      grid-template-rows:1fr auto;
      min-height:0;
    }
    .messages {
      overflow-y:auto;
      padding:24px;
      display:flex;
      flex-direction:column;
      gap:14px;
    }
    .messages::-webkit-scrollbar { width:6px; }
    .messages::-webkit-scrollbar-thumb { background:rgba(34,197,94,0.35); border-radius:999px; }
    .msg {
      display:flex;
      gap:12px;
      align-items:flex-start;
      max-width:900px;
    }
    .msg.user {
      margin-left:auto;
      flex-direction:row-reverse;
    }
    .avatar {
      width:38px;
      height:38px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
      font-size:18px;
      background:linear-gradient(135deg,var(--c-green-3),var(--c-green-1));
      color:#fff;
      box-shadow:var(--glow-green);
    }
    .bubble {
      padding:14px 16px;
      border-radius:18px;
      line-height:1.55;
      font-size:14px;
      white-space:pre-wrap;
      word-break:break-word;
      max-width:min(760px, calc(100vw - 120px));
    }
    .bubble.bot {
      background:var(--c-bg-card);
      border:1px solid var(--c-border);
      color:var(--c-text-1);
      border-top-left-radius:6px;
    }
    .bubble.user {
      background:linear-gradient(135deg,var(--c-green-3),var(--c-green-2));
      color:#fff;
      border-top-right-radius:6px;
    }
    .meta {
      margin-top:6px;
      font-size:11px;
      color:var(--c-text-mute);
    }
    .composer {
      padding:16px 24px 24px;
      border-top:1px solid var(--c-border);
      background:linear-gradient(180deg, rgba(5,18,10,0), rgba(5,18,10,0.95));
    }
    .composer-row {
      display:flex;
      gap:12px;
      align-items:flex-end;
    }
    .chat-input {
      flex:1;
      resize:none;
      min-height:56px;
      max-height:160px;
      padding:16px 18px;
      border-radius:18px;
      border:1px solid var(--c-border);
      background:rgba(255,255,255,0.05);
      color:var(--c-text-1);
      font:inherit;
      outline:none;
    }
    .chat-input:focus {
      border-color:rgba(34,197,94,0.5);
      box-shadow:0 0 0 3px rgba(34,197,94,0.12);
    }
    .send-btn {
      width:56px;
      height:56px;
      border:none;
      border-radius:18px;
      background:linear-gradient(135deg,var(--c-green-3),var(--c-green-1));
      color:#fff;
      font-size:18px;
      cursor:pointer;
      box-shadow:var(--glow-green);
      flex-shrink:0;
    }
    .send-btn:disabled { opacity:0.6; cursor:not-allowed; }
    .helper-row {
      display:flex;
      justify-content:space-between;
      gap:12px;
      margin-top:10px;
      flex-wrap:wrap;
      color:var(--c-text-mute);
      font-size:12px;
    }
    .starter-row {
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:12px;
    }
    .starter-chip {
      padding:8px 12px;
      border-radius:999px;
      border:1px solid var(--c-border);
      background:rgba(255,255,255,0.04);
      color:var(--c-text-2);
      cursor:pointer;
      font-size:12px;
    }
    .starter-chip:hover {
      background:rgba(34,197,94,0.08);
      color:var(--c-green-1);
    }
    .typing {
      display:inline-flex;
      gap:6px;
      align-items:center;
      padding:12px 16px;
    }
    .typing span {
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--c-green-1);
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay:0.15s; }
    .typing span:nth-child(3) { animation-delay:0.3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform:translateY(0); opacity:.4; }
      40% { transform:translateY(-6px); opacity:1; }
    }
    @media (max-width: 768px) {
      .chat-hero, .messages, .composer { padding-left:16px; padding-right:16px; }
      .bubble { max-width:100%; }
      .composer-row { align-items:stretch; }
      .send-btn { width:52px; height:52px; border-radius:16px; }
    }
  </style>
</head>
<body>
  <div class="bg-ambient"></div>
  <div class="particles"></div>
  <div class="app-shell">
    <aside class="sidebar"></aside>
    <div class="main-content">
      <div class="top-bar"></div>
      <main class="page">
        <section class="chat-page">
          <div class="chat-hero">
            <h1>AgriBot</h1>
            <p>Ask anything about crops, weather, market prices, fertilizer, pests, soil health, or schemes. The assistant will answer using your account and live backend data when available.</p>
            <div class="chat-status"><span class="status-dot"></span>Online and ready</div>
            <div class="starter-row" id="starterRow">
              <button class="starter-chip" type="button" data-text="What is the live weather in my area?">Weather</button>
              <button class="starter-chip" type="button" data-text="What are the latest market prices for wheat and rice?">Market prices</button>
              <button class="starter-chip" type="button" data-text="How much fertilizer should I use for wheat?">Fertilizer advice</button>
              <button class="starter-chip" type="button" data-text="How do I control pests in maize?">Pest control</button>
            </div>
          </div>

          <div class="chat-shell">
            <div class="messages" id="messages"></div>
            <div class="composer">
              <div class="composer-row">
                <textarea id="userInput" class="chat-input" rows="1" placeholder="Type your farming question..." onkeydown="handleKeydown(event)" oninput="autoResize(this)"></textarea>
                <button id="sendBtn" class="send-btn" type="button" onclick="sendMessage()">➤</button>
              </div>
              <div class="helper-row">
                <div>Press Enter to send, Shift+Enter for a new line.</div>
                <div id="userContext">Using live backend data</div>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div class="toast-root"></div>
  <script src="js/shared-nav.js"></script>
  <script src="js/api-service.js"></script>
  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const starterRow = document.getElementById('starterRow');

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getTime() {
      return new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
    }

    function renderMessage(text, role = 'bot') {
      const row = document.createElement('div');
      row.className = `msg ${role}`;
      row.innerHTML = `
        <div class="avatar">${role === 'user' ? '👨‍🌾' : '🤖'}</div>
        <div>
          <div class="bubble ${role}">${escapeHtml(text).replace(/\n/g, '<br>')}</div>
          <div class="meta">${getTime()}</div>
        </div>
      `;
      messagesEl.appendChild(row);
      messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
      return row;
    }

    function renderTyping() {
      const row = document.createElement('div');
      row.className = 'msg';
      row.id = 'typingRow';
      row.innerHTML = `
        <div class="avatar">🤖</div>
        <div class="bubble bot typing"><span></span><span></span><span></span></div>
      `;
      messagesEl.appendChild(row);
      messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
    }

    function removeTyping() {
      const row = document.getElementById('typingRow');
      if (row) row.remove();
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 160) + 'px';
    }

    function handleKeydown(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    async function sendMessage(textOverride = '') {
      const text = String(textOverride || inputEl.value || '').trim();
      if (!text) return;

      inputEl.value = '';
      inputEl.style.height = 'auto';
      starterRow.style.display = 'none';
      renderMessage(text, 'user');
      renderTyping();
      sendBtn.disabled = true;

      try {
        const data = await APIService.askChatbot(text);
        removeTyping();
        renderMessage(data.reply || 'I could not generate a response right now.', 'bot');
      } catch (error) {
        removeTyping();
        renderMessage('I could not reach the assistant backend right now. Please start the server and try again.', 'bot');
      } finally {
        sendBtn.disabled = false;
      }
    }

    async function loadGreeting() {
      let greeting = 'Ask me about crops, weather, fertilizer, pests, or market prices.';
      try {
        const user = APIService.getUserData() || await APIService.getCurrentUser().catch(() => null);
        if (user?.name) {
          document.getElementById('userContext').textContent = `Signed in as ${user.name}`;
          const crop = user.crop ? ` Your main crop is ${user.crop}.` : '';
          const location = user.location ? ` I can tailor advice for ${user.location}.` : '';
          greeting = `Hello ${user.name}!${crop}${location} Ask me anything about your farm.`;
        }
      } catch {}
      renderMessage(greeting, 'bot');
    }

    document.getElementById('starterRow').addEventListener('click', (event) => {
      const button = event.target.closest('button[data-text]');
      if (!button) return;
      sendMessage(button.dataset.text);
    });

    loadGreeting();
    initNav('chatbot', '🤖 AI Chatbot', 'Ask AgriBot farming questions');
  </script>
</body>
</html>
